[mcp_servers.iris]
command = "npx"
args = ["--yes", "@tools-for-agents/iris@0.1.0", "mcp"]
startup_timeout_sec = 30
tool_timeout_sec = 120
enabled = true
enabled_tools = ["iris_look", "iris_play", "iris_runs", "iris_stats"]

[mcp_servers.iris.env]
IRIS_CHROME = "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
