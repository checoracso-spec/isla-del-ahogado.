name: Build and deploy Isla del Ahogado to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  PROJECT_DIR: isla-del-ahogado

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot headless and Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -L --fail --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -L --fail --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          if [ -d /tmp/templates/templates ]; then
            cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          else
            cp -R /tmp/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          fi
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build/web"
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --editor --quit
          Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --export-release Web "build/web/index.html"
          # Publish this milestone under a fresh path so browsers with an old
          # Godot service worker can still fetch the new export.
          mkdir -p "$PROJECT_DIR/build/web/prompt-3"
          find "$PROJECT_DIR/build/web" -maxdepth 1 -type f -exec cp {} "$PROJECT_DIR/build/web/prompt-3/" \;

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: isla-del-ahogado/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
